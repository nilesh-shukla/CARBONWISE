services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: carbonwise
      POSTGRES_USER: carbonwise
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbonwise -d carbonwise"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - carbonwise-postgres:/var/lib/postgresql/data

volumes:
  carbonwise-postgres:
