services:
  # This file is for local development only. Production must provide secrets,
  # HTTPS ingress, private service networking, and managed database recovery.
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carbonwise}
      POSTGRES_USER: ${POSTGRES_USER:-carbonwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - carbonwise-postgres:/var/lib/postgresql/data

  fastapi:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${FASTAPI_APP_ENV:-development}
      DEBUG: ${FASTAPI_DEBUG:-false}
      HOST: 0.0.0.0
      PORT: 8000
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  go-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      LISTEN_ADDRESS: ":8080"
      DATABASE_URL: "${DATABASE_URL:-postgres://${POSTGRES_USER:-carbonwise}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-carbonwise}?sslmode=disable}"
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-change-me-before-sharing}
      JWT_ISSUER: ${JWT_ISSUER:-carbonwise-go-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-carbonwise-client}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      FASTAPI_URL: http://fastapi:8000
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-carbonwise_refresh}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-20}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      fastapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--output-document=/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

volumes:
  carbonwise-postgres:
